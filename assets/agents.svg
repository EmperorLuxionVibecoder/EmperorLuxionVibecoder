<text class="label" x="380" y="75">TOKEN</text>
<text class="label" x="530" y="75">VENUE</text>
<text class="label" x="700" y="75">STATUS</text>
<line x1="30" y1="82" x2="820" y2="82" stroke="#30363d" stroke-width="0.5"/>

