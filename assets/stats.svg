<text class="label" style="fill:#EC4899" x="30" y="415">ENGINE: LIVE</text>
<text class="label" x="365" y="400">METHODOLOGY: Walk-forward OOS | No look-ahead</text>
<text class="label" style="fill:#9945FF" text-anchor="end" x="820" y="415">LYRA v1.0</text>

