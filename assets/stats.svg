<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="360" version="1.1" width="850" xmlns="http://www.w3.org/2000/svg">
<defs>
<style type="text/css"><![CDATA[
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
  .bg { fill: #0D1117; stroke: #30363d; stroke-width: 1; }
  .header { font-family: 'JetBrains Mono', monospace; fill: #EC4899; font-size: 18px; font-weight: bold; letter-spacing: 2px; }
  .label { font-family: 'JetBrains Mono', monospace; fill: #8b949e; font-size: 11px; }
  .value { font-family: 'JetBrains Mono', monospace; fill: #e6edf3; font-size: 14px; font-weight: bold; }
  .value-pink { font-family: 'JetBrains Mono', monospace; fill: #EC4899; font-size: 14px; font-weight: bold; }
  .value-green { font-family: 'JetBrains Mono', monospace; fill: #14F195; font-size: 14px; font-weight: bold; }
  .value-purple { font-family: 'JetBrains Mono', monospace; fill: #9945FF; font-size: 14px; font-weight: bold; }
  .value-big { font-family: 'JetBrains Mono', monospace; fill: #EC4899; font-size: 36px; font-weight: bold; }
  .dim { font-family: 'JetBrains Mono', monospace; fill: #484f58; font-size: 11px; }
  .bar-bg { fill: #21262d; }
  .bar-pink { fill: #EC4899; }
  .bar-purple { fill: #9945FF; }
  .bar-green { fill: #14F195; }
  .bar-yellow { fill: #F59E0B; }
]]></style>
<pattern id="grid" patternUnits="userSpaceOnUse" width="40" height="40">
  <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1f26" stroke-width="0.5"/>
</pattern>
</defs>

<rect class="bg" x="0" y="0" width="100%" height="100%" rx="12" ry="12"/>
<rect fill="url(#grid)" fill-opacity="0.3" x="0" y="0" width="100%" height="100%"/>

<!-- Header -->
<text class="header" x="30" y="38">PROJECT LYRA // BUILD STATUS</text>
<line x1="30" y1="50" x2="820" y2="50" stroke="#EC4899" stroke-opacity="0.4" stroke-width="1"/>

<!-- Left: Live Status -->
<text class="value-big" x="30" y="105">10</text>
<text class="label" x="105" y="105">autonomous agents</text>

<circle fill="#14F195" cx="38" cy="135" r="5"/>
<text class="value-green" x="52" y="140">Meteora DLMM</text>
<text class="dim" x="210" y="140">live on mainnet</text>

<circle fill="#F59E0B" cx="38" cy="170" r="5"/>
<text class="value" x="52" y="175">Orca Whirlpools</text>
<text class="dim" x="210" y="175">in development</text>

<circle fill="#F59E0B" cx="38" cy="205" r="5"/>
<text class="value" x="52" y="210">Raydium CLMM</text>
<text class="dim" x="210" y="210">in development</text>

<circle fill="#F59E0B" cx="38" cy="240" r="5"/>
<text class="value" x="52" y="245">Ranger Vault (USDC)</text>
<text class="dim" x="245" y="245">integrating</text>

<circle fill="#F59E0B" cx="38" cy="275" r="5"/>
<text class="value" x="52" y="280">Metaplex Identity</text>
<text class="dim" x="220" y="280">integrating</text>

<circle fill="#484f58" cx="38" cy="310" r="5"/>
<text class="value" x="52" y="315">Degen Discovery (Rex)</text>
<text class="dim" x="260" y="315">planned</text>

<!-- Divider -->
<line x1="420" y1="65" x2="420" y2="340" stroke="#30363d" stroke-width="1"/>

<!-- Right: Progress Bars -->
<text class="label" x="450" y="80">DEVELOPMENT PROGRESS</text>

<text class="label" x="450" y="110">AGENT SWARM ARCHITECTURE</text>
<rect class="bar-bg" x="450" y="118" width="370" height="10" rx="5"/>
<rect class="bar-pink" x="450" y="118" width="370" height="10" rx="5"/>

<text class="label" x="450" y="150">WALK-FORWARD BACKTESTING</text>
<rect class="bar-bg" x="450" y="158" width="370" height="10" rx="5"/>
<rect class="bar-pink" x="450" y="158" width="370" height="10" rx="5"/>

<text class="label" x="450" y="190">RISK MANAGEMENT + CIRCUIT BREAKERS</text>
<rect class="bar-bg" x="450" y="198" width="370" height="10" rx="5"/>
<rect class="bar-pink" x="450" y="198" width="370" height="10" rx="5"/>

<text class="label" x="450" y="230">MULTI-VENUE EXECUTION</text>
<rect class="bar-bg" x="450" y="238" width="370" height="10" rx="5"/>
<rect class="bar-purple" x="450" y="238" width="170" height="10" rx="5"/>

<text class="label" x="450" y="270">USDC VAULT + ON-CHAIN IDENTITY</text>
<rect class="bar-bg" x="450" y="278" width="370" height="10" rx="5"/>
<rect class="bar-purple" x="450" y="278" width="100" height="10" rx="5"/>

<text class="label" x="450" y="310">DEGEN POOL DISCOVERY AGENT</text>
<rect class="bar-bg" x="450" y="318" width="370" height="10" rx="5"/>
<rect class="bar-yellow" x="450" y="318" width="40" height="10" rx="5"/>

<!-- Footer -->
<line x1="30" y1="340" x2="820" y2="340" stroke="#30363d" stroke-width="1"/>

</svg>